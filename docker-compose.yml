services:
  app:
    build: .
    image: meta-valv-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
    volumes:
      - ./credenciales.json:/app/credenciales.json:ro
      - ./config.json:/app/config.json:ro
      - ./logo_valv.png:/app/logo_valv.png:ro
      - ./login_video_2.mp4:/app/login_video_2.mp4:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
